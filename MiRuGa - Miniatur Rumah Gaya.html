<script>
const $=i=>document.getElementById(i),sh=a=>{a=a.slice();for(let i=a.length;i>1;i--){const j=Math.random()*i|0;[a[i-1],a[j]]=[a[j],a[i-1]]}return a};

/* ---------- Jendela 1 ---------- */
const T=[['Pengertian Gaya','Gaya adalah tarikan atau dorongan pada benda.','Mendorong meja, menarik pintu, menendang bola.'],['Gaya Otot','Gaya yang berasal dari tenaga otot manusia atau hewan.','Mengangkat tas, mendorong gerobak, sapi menarik bajak.'],['Gaya Gesek','Muncul saat dua permukaan bersentuhan dan melawan gerak benda.','Rem sepeda, sol sepatu tidak licin, menggosok telapak tangan.'],['Gaya Magnet','Gaya tarik atau tolak yang menarik benda logam tertentu.','Magnet kulkas, kompas, penutup kotak pensil.'],['Gaya Gravitasi','Tarikan bumi ke pusat bumi.','Buah jatuh, hujan turun, bola yang dilempar ke atas akan jatuh.'],['Gaya Pegas','Muncul saat pegas atau karet ditarik atau ditekan, lalu kembali ke bentuk semula.','Kasur pegas, pulpen tekan, ketapel, trampolin.']];
function win1(){openM('Jendela 1: Mengenal Gaya','<div>'+T.map((t,i)=>`<button class="b" data-t="${i}">${t[0]}</button>`).join('')+'</div><div id="tc" class="card">Pilih salah satu tombol di atas 👆</div>');
$('mb').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;const i=+b.dataset.t,t=T[i];S.tab.add(i);b.textContent='✅ '+t[0];beep(700);$('tc').innerHTML=`<h3>${t[0]}</h3><p>${t[1]}</p><p>🌟 <b>Contoh:</b> ${t[2]}</p><small>Dibuka: ${S.tab.size}/6</small>`;R=`${t[0]}. ${t[1]} Contoh: ${t[2]}`;upd()}}
/* ---------- Jendela 2 ---------- */
const B=[['Diam → Bergerak','Gaya dapat membuat benda diam menjadi bergerak.'],['Bergerak → Diam','Gaya dapat menghentikan benda yang bergerak. Rem sepeda memakai gaya gesek.'],['Mengubah Kecepatan','Gaya kecil membuat benda bergerak pelan, gaya besar membuatnya cepat.'],['Mengubah Arah','Gaya dapat mengubah arah gerak benda, misalnya bola yang memantul.'],['Mengubah Bentuk','Gaya dapat mengubah bentuk benda. Tanah liat tetap gepeng, pegas kembali seperti semula.']];
const bike='<svg viewBox="0 0 120 70" width="104" fill="none" stroke="#1f2433" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="25" cy="52" r="16"/><circle cx="95" cy="52" r="16"/><path d="M25 52L45 26L85 30L55 52L45 26M55 52L85 30L95 52M85 30L82 17H95M38 24H52M50 24L62 41L55 52" stroke="#e8453c"/><circle cx="64" cy="5" r="6" fill="#ffcc99"/><path d="M50 24L62 11M62 11L90 17"/><circle cx="98" cy="17" r="3" fill="#ffd93b"/></svg>';

setTimeout(()=>{b.querySelector('.lid').animate([{transform:'none'},{transform:'translateY(-34px) rotate(-25deg)'}],{duration:400,fill:'forwards'});beep(900,.15)},450);
setTimeout(()=>{S.box.add(i);b.lastChild.textContent='✅';sim(i);upd()},900)}}
function sim(i){const o0=['⚽','','🚀','⚽'][i];const st=x=>`<div class="st">${x}</div>`;let h='';
const bt=(id,t)=>`<button class="b" id="${id}">${t}</button>`;
if(i==0)h=st('<span id="o" class="o">⚽</span>')+bt('a1','👟 Dorong bola');

$('bx').innerHTML=`<div class="card"><h3>${B[i][0]}</h3><p>${B[i][1]}</p>${h}<p id="mg" class="hint"></p></div>`;R=B[i][0]+'. '+B[i][1];
const o=$('o'),m=t=>$('mg').textContent=t;let a;const go=(to,d,ea='ease-out')=>{o.getAnimations().forEach(x=>x.cancel());o.style.left='5%';a=o.animate([{left:'5%'},{left:to}],{duration:d,easing:ea,fill:'forwards'})};
